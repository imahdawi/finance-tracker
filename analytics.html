<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويش - التحليلات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/analytics.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app-shell">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <span class="jar-icon">🏺</span>
            <span>تحويش</span>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-link">
                <i class="fas fa-chart-pie"></i>
                <span>الرئيسية</span>
            </a>
            <a href="transactions.html" class="nav-link">
                <i class="fas fa-list-ul"></i>
                <span>العمليات</span>
            </a>
            <a href="analytics.html" class="nav-link active">
                <i class="fas fa-chart-bar"></i>
                <span>التحليلات</span>
            </a>
            <a href="settings.html" class="nav-link">
                <i class="fas fa-cog"></i>
                <span>الإعدادات</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="avatar" id="userAvatar">م</div>
                <div class="meta">
                    <div class="name" id="userName">مستخدم</div>
                    <div class="role">حساب شخصي</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- ===== MAIN ===== -->
    <main class="main">
        <div class="topbar">
            <div class="topbar-heading">
                <span class="eyebrow">التحليلات</span>
                <h1>التحليلات والإحصائيات</h1>
            </div>
            <div class="topbar-actions">
                <div class="period-selector">
                    <button class="period-btn active" data-period="month">هذا الشهر</button>
                    <button class="period-btn" data-period="quarter">آخر 3 شهور</button>
                    <button class="period-btn" data-period="year">هذا العام</button>
                    <button class="period-btn" data-period="all">الكل</button>
                </div>
                <button id="themeToggle" class="icon-btn-circle" title="الوضع الليلي"><i class="fas fa-moon"></i></button>
                <button id="logoutBtn" class="icon-btn-circle danger" title="تسجيل الخروج"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>

        <div class="analytics-stats">
            <div class="stat-card-analytics">
                <h4>إجمالي الإنفاق</h4>
                <p class="stat-value" id="totalSpending">0.00 ج.م</p>
            </div>
            <div class="stat-card-analytics">
                <h4>أعلى فئة إنفاق</h4>
                <p class="stat-value" id="topCategory">-</p>
                <span class="stat-sub" id="topCategoryAmount">0.00 ج.م</span>
            </div>
            <div class="stat-card-analytics">
                <h4>متوسط الإنفاق اليومي</h4>
                <p class="stat-value" id="avgDaily">0.00 ج.م</p>
            </div>
            <div class="stat-card-analytics">
                <h4>أعلى عملية</h4>
                <p class="stat-value" id="highestExpense">0.00 ج.م</p>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>توزيع المصروفات</h3>
                <div class="chart-container"><canvas id="categoryChart"></canvas></div>
            </div>
            <div class="chart-card">
                <h3>اتجاه الإنفاق الشهري</h3>
                <div class="chart-container"><canvas id="trendChart"></canvas></div>
            </div>
        </div>

        <div class="category-breakdown">
            <h3>تفاصيل التصنيفات</h3>
            <div class="breakdown-grid" id="breakdownGrid"></div>
        </div>
    </main>
</div>

<div id="toastContainer"></div>

    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/analytics.js"></script>
</body>
</html>
